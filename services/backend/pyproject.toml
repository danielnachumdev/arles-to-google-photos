[project]
name = "arles-migrator-backend"
version = "1.0.0"
description = "FastAPI service to migrate Arles HTML album exports into Google Photos"
requires-python = ">=3.9"
# Runtime / publish group (formerly requirements/publish.txt).
# Install with: uv sync
dependencies = [
    "gp_wrapper>=0.9.12",
    "beautifulsoup4",
    "tqdm",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "piexif>=1.1.3",
    "google-cloud-storage>=2.14.0",
    "sqlalchemy>=2.0.25,<3",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.16.5",
    "pillow>=10.0.0",
]

# Dev group (formerly requirements/dev.txt extras vs publish).
# Runtime deps are not duplicated here.
# Install with: uv sync --group dev   (or: uv sync --all-groups)
[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy",
    "pylint",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "types-beautifulsoup4",
    "types-tqdm",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The importable package is literally named `src` (uvicorn src.api.app:app).
# package-dir "" = "." disables setuptools src-layout auto-detection (which would look for src/src).
[tool.setuptools]
packages = ["src", "src.export", "src.jobs", "src.jobs.persistence", "src.api", "src.api.routers"]

[tool.setuptools.package-dir]
"" = "."

# default-groups = [] so `uv sync` is runtime/publish only.
# `uv sync --group dev` adds mypy/pylint/stubs. `uv sync --all-groups` is equivalent here.
# gp_wrapper 0.9.12+ imports moviepy.editor (removed in moviepy 2.x).
[tool.uv]
default-groups = []
constraint-dependencies = [
    "moviepy>=1.0.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -n auto --cov=src --cov-report=term-missing"
markers = [
    "gcs: live Google Cloud Storage tests (opt-in via ARLES_LIVE_GCS=1)",
]
