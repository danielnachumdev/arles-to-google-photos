name: CD

# Thin orchestrator. Semver at CD = bump → wheel → GitHub Release → move vMAJOR
# (or skip on noBump). Optional PyPI upload of the same wheel:
#   publish-pypi: true  +  permissions.id-token: write
# Pin:
#   uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@latest

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve bump only; do not create a Release"
        type: boolean
        default: true
      sha:
        description: "Commit SHA (empty = current GITHUB_SHA)"
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: read
  actions: read
  # Required when publish-pypi: true (Trusted Publishing / OIDC):
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  semver:
    name: Semver
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    uses: danielnachumdev/actions/.github/workflows/semver-cd.yml@latest
    with:
      standards-ref: v1
      dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event.inputs.sha != '' && github.event.inputs.sha || github.sha) }}
      # publish-pypi: true
    # User-owned repos: pass secrets by name (secrets: inherit is org/enterprise only).
    # Required whenever semver-cd declares secrets: — empty token is OK for OIDC-only.
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
