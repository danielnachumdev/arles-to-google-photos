name: CI

# Thin orchestrator for monorepo (backend Python + frontend Node).
# Prefer requiring check "CI" (aggregate). Non-publisher app — no Semver.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    with:
      working-directory: services/backend
      disable-node: true
      sync-args: "--group dev"

  frontend:
    name: Frontend
    uses: danielnachumdev/actions/.github/workflows/ci.yml@latest
    with:
      working-directory: services/frontend
      disable-python: true
      # Prior CI was Node 22 only; default matrix includes 20 where vitest asserts flake.
      node-versions: '["22"]'

  # Aggregate gate → single required check name "CI" (local job, not reusable).
  ci:
    name: CI
    needs: [backend, frontend]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require backend + frontend success
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          echo "backend=${BACKEND} frontend=${FRONTEND}"
          [[ "${BACKEND}" == "success" ]]
          [[ "${FRONTEND}" == "success" ]]

  dependabot-auto-merge:
    name: Dependabot auto-merge
    needs: [ci]
    if: >
      always() &&
      needs.ci.result == 'success' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: danielnachumdev/actions/.github/workflows/dependabot-auto-merge.yml@latest
